[project]
name = "brokeberg"
version = "0.1.0"
description = "Brokeberg streaming pipeline: ingest, extract, cluster, verify, graph."
readme = "README.md"
authors = [
    { name = "Aarush2801", email = "a882sing@uwaterloo.ca" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.11.0",
    "beautifulsoup4>=4.15.0",
    "boto3>=1.43.108",
    "fastapi>=0.142.4",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "mangum>=0.22.0",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "selectolax>=1.0.0",
    "sqlalchemy>=2",
    "tenacity>=9.1.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
# Local bge embeddings (pulls in torch). Prod embeds with Titan on Bedrock, so the Lambda image
# installs without this group.
local = [
    "sentence-transformers>=6.1.0",
]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "types-pyyaml>=6.0.12.20260906",
    "vcrpy>=8.3.0",
]

[tool.uv]
default-groups = ["dev", "local"]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "brokeberg"
module-root = ""

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["sentence_transformers.*", "pgvector.*", "boto3.*", "botocore.*", "vcr.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
