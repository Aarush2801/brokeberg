        \                          level, because free and premium content share URL\n#
        \                          namespaces and cannot be separated by path here)\n#
        \  - TRAINING crawlers  -> BLOCK site-wide       (protect the proprietary\n#
        \                          ratings dataset and paid analysis from model\n#
        \                          training corpora)\n#\n# ============================================================================\n#
